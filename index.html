<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mezi — Projects</title>
<meta name="description" content="AI-assisted interactive fiction, game UI, and SillyTavern extensions.">
<style>
  :root {
    --bg: #0f0d14;
    --panel: #181521;
    --panel-hover: #201c2c;
    --text: #ece8f4;
    --muted: #9b94ad;
    --accent: #c9a2ff;
    --accent-2: #ff9ec7;
    --border: #2a2536;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf8fd; --panel: #ffffff; --panel-hover: #f3eefb;
      --text: #1d1828; --muted: #6b6480; --accent: #7a3fd1;
      --accent-2: #d1417f; --border: #e4dcf0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  header { padding: 72px 0 40px; }
  h1 {
    font-size: clamp(2.2rem, 6vw, 3.6rem); margin: 0 0 12px; letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { color: var(--muted); max-width: 620px; margin: 0 0 20px; font-size: 1.1rem; }
  .links a { color: var(--accent); margin-right: 18px; text-decoration: none; font-weight: 600; }
  .links a:hover { text-decoration: underline; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 24px; }
  .chip {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: .9rem;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.active { background: var(--accent); color: #140f1e; border-color: var(--accent); font-weight: 600; }

  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); padding-bottom: 64px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px; display: flex; flex-direction: column; transition: transform .15s, background .15s, border-color .15s;
  }
  .card:hover { transform: translateY(-3px); background: var(--panel-hover); border-color: var(--accent); }
  .card h2 { margin: 0 0 6px; font-size: 1.2rem; }
  .card p { margin: 0 0 16px; color: var(--muted); flex: 1; font-size: .96rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .tag { font-size: .75rem; padding: 2px 10px; border-radius: 999px; background: var(--border); color: var(--muted); }
  .actions a {
    color: var(--accent); text-decoration: none; font-weight: 600; font-size: .92rem; margin-right: 16px;
  }
  .actions a:hover { text-decoration: underline; }
  .wip { color: var(--accent-2); font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  footer { border-top: 1px solid var(--border); padding: 28px 0 48px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mezi</h1>
    <p>Independent creator and developer building AI-assisted interactive fiction, game UI, and SillyTavern extensions.</p>
    <div class="links">
      <a href="https://github.com/Mezi99">GitHub</a>
    </div>
  </header>

  <div class="controls" id="filters" role="group" aria-label="Filter projects"></div>
  <main class="grid" id="grid"></main>

  <footer>© <span id="year"></span> Mezi</footer>
</div>

<script>
/* ============ EDIT YOUR PROJECTS HERE ============
   title:   project name
   desc:    one or two sentences
   tags:    used for the filter buttons
   repo:    GitHub URL (optional)
   demo:    live demo URL (optional)
   status:  "wip" shows a badge (optional)
*/
const projects = [
  {
    title: "SillyTavern-Storybook",
    desc: "A SillyTavern extension that turns roleplay chats into illustrated storybooks, ported from Marinara Engine's Storyboard.",
    tags: ["SillyTavern", "Extension"],
    repo: "https://github.com/Mezi99/SillyTavern-Storybook"
  },
  {
    title: "SillyTavern MBTI Widget",
    desc: "Roleplay tool using LLM-driven behavioral tagging to track character personality, displayed as a live radar chart.",
    tags: ["SillyTavern", "Extension"],
    repo: "https://github.com/Mezi99/SillyTavern-MBTI_Widget"
  },
  {
    title: "Agentic Harness",
    desc: "Director / Author / Editor pipeline for SillyTavern with code-owned state, so the story stays consistent while the LLM writes.",
    tags: ["SillyTavern", "Extension", "Agents"],
    status: "wip"
  },
  {
    title: "Blackwood Isle",
    desc: "A visual novel murder mystery built with Ractive.js and a richly styled UI.",
    tags: ["Game", "Web"],
  },
  {
    title: "Blackgate Maximum Security Prison",
    desc: "Character card paired with an AAA-style HTML/CSS/JS interface prototype.",
    tags: ["Game", "Web", "UI"]
  },
  {
    title: "Nephele's Magic Roll",
    desc: "A gamified multiplication-learning web app made for my kid.",
    tags: ["Web", "Education"]
  },
  {
    title: "Relationship Tracker",
    desc: "SillyTavern extension tracking five directional relationship dimensions between characters.",
    tags: ["SillyTavern", "Extension"]
  }
];
/* ================================================ */

const grid = document.getElementById("grid");
const filters = document.getElementById("filters");
let active = "All";

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderFilters() {
  const all = ["All", ...new Set(projects.flatMap(p => p.tags))];
  filters.innerHTML = all.map(t =>
    `<button class="chip${t === active ? " active" : ""}" data-tag="${esc(t)}">${esc(t)}</button>`
  ).join("");
}

function renderGrid() {
  const list = active === "All" ? projects : projects.filter(p => p.tags.includes(active));
  grid.innerHTML = list.map(p => `
    <article class="card">
      ${p.status === "wip" ? '<span class="wip">Work in progress</span>' : ""}
      <h2>${esc(p.title)}</h2>
      <p>${esc(p.desc)}</p>
      <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="actions">
        ${p.repo ? `<a href="${esc(p.repo)}" target="_blank" rel="noopener">Code →</a>` : ""}
        ${p.demo ? `<a href="${esc(p.demo)}" target="_blank" rel="noopener">Live demo →</a>` : ""}
      </div>
    </article>
  `).join("");
}

filters.addEventListener("click", e => {
  const btn = e.target.closest("[data-tag]");
  if (!btn) return;
  active = btn.dataset.tag;
  renderFilters();
  renderGrid();
});

document.getElementById("year").textContent = new Date().getFullYear();
renderFilters();
renderGrid();
</script>
</body>
</html>
